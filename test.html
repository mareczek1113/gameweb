<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steam Style Layout</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#1b2838;
    color:#c7d5e0;
}

header{
    height:50px;
    background:#171a21;
    display:flex;
    align-items:center;
    padding:0 15px;
    gap:30px;
    font-size:14px;
}

header nav{
    display:flex;
    gap:25px;
}

header nav span{
    cursor:pointer;
    color:#c7d5e0;
}

.searchTop{
    margin-left:auto;
}

.searchTop input{
    background:#2a475e;
    border:none;
    color:white;
    padding:8px 12px;
    width:260px;
}

.container{
    display:flex;
    gap:15px;
    padding:20px;
}

.left{
    flex:1;
}

.right{
    width:280px;
}

.title{
    font-size:30px;
    margin-bottom:20px;
    font-weight:300;
}

.searchBox{
    display:flex;
    background:#16202d;
    padding:8px;
    gap:10px;
    align-items:center;
}

.searchBox input{
    flex:1;
    background:#24384c;
    border:1px solid #4b6b86;
    color:white;
    padding:8px;
}

.searchBox button{
    background:#2a79b8;
    color:white;
    border:none;
    padding:8px 18px;
    cursor:pointer;
}

.resultsInfo{
    background:#16202d;
    padding:12px;
    font-size:13px;
    margin-top:5px;
}

.game{
    height:72px;
    background:#22384b;
    border-bottom:1px solid #0f1b26;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
}

.game:hover{
    background:#2d4d66;
}

.placeholder{
    width:250px;
    height:18px;
    background:#4b6173;
    border-radius:3px;
}

.price{
    width:55px;
    height:16px;
    background:#4b6173;
    border-radius:3px;
}

.filter{
    background:#22384b;
    margin-bottom:15px;
}

.filter h3{
    background:#2c3e50;
    padding:10px;
    font-size:15px;
    font-weight:normal;
}

.filterContent{
    padding:12px;
}

.slider{
    height:4px;
    background:#59bfff;
    margin:10px 0 15px;
}

.option{
    display:flex;
    align-items:center;
    gap:10px;
    margin:10px 0;
    color:#9fb4c8;
    font-size:14px;
}

.option input{
    width:15px;
    height:15px;
}

.tagSearch{
    width:100%;
    margin-top:10px;
    background:#1b2838;
    border:1px solid #4a657e;
    color:white;
    padding:8px;
}

.section{
    background:#22384b;
    padding:12px;
    margin-bottom:10px;
    color:#b8c7d5;
}
</style>

</head>
<body>

<header>

<div class="searchTop">
<input placeholder="Search the store">
</div>

</header>

<div class="container">

<div class="left">

<div class="title">All Products</div>

<div class="searchBox">
<input placeholder="enter search term or tag">
<button>Search</button>
</div>

<div class="game">
<div class="placeholder"></div>
<div class="price"></div>
</div>

<div class="game">
<div class="placeholder"></div>
<div class="price"></div>
</div>

<div class="game">
<div class="placeholder"></div>
<div class="price"></div>
</div>

<div class="game">
<div class="placeholder"></div>
<div class="price"></div>
</div>

<div class="game">
<div class="placeholder"></div>
<div class="price"></div>
</div>

<div class="game">
<div class="placeholder"></div>
<div class="price"></div>
</div>

<div class="game">
<div class="placeholder"></div>
<div class="price"></div>
</div>

<div class="game">
<div class="placeholder"></div>
<div class="price"></div>
</div>

</div>


</div>
</div>

</div>

</div>

</body>
</html>

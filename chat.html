<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Chat</title>
<style>
  :root{
    --bg-deepest:#1e1f22;
    --bg-sidebar:#2b2d31;
    --bg-chat:#313338;
    --bg-input:#383a40;
    --bg-hover:#3a3c42;
    --text-main:#f2f3f5;
    --text-muted:#949ba4;
    --text-faint:#6d7178;
    --accent:#5865f2;
    --accent-hover:#4752c4;
    --online:#23a55a;
    --danger:#da373c;
    --divider:#3f4147;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:"gg sans","Helvetica Neue",Helvetica,Arial,sans-serif;
    background:var(--bg-chat);
    color:var(--text-main);
    overflow:hidden;
  }
  #app{
    display:flex;
    height:100vh;
    width:100vw;
  }

  /* ---------- Sidebar (online users) ---------- */
  #sidebar{
    width:240px;
    flex-shrink:0;
    background:var(--bg-sidebar);
    display:flex;
    flex-direction:column;
  }
  #sidebar-header{
    height:48px;
    display:flex;
    align-items:center;
    padding:0 16px;
    font-weight:700;
    font-size:15px;
    box-shadow:0 1px 0 rgba(0,0,0,.2);
    flex-shrink:0;
  }
  #online-list{
    flex:1;
    overflow-y:auto;
    padding:16px 8px;
  }
  #online-list .section-label{
    color:var(--text-faint);
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    padding:0 8px 6px;
    letter-spacing:.02em;
  }
  .user-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:6px 8px;
    border-radius:6px;
    cursor:default;
  }
  .user-row:hover{background:var(--bg-hover);}
  .user-row .uname{
    font-size:14px;
    color:var(--text-main);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .user-row.me .uname{color:#fff;font-weight:600;}
  .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--online);
    flex-shrink:0;
    box-shadow:0 0 0 2px var(--bg-sidebar);
  }
  #sidebar-footer{
    height:52px;
    background:#232428;
    display:flex;
    align-items:center;
    padding:0 8px;
    gap:8px;
    flex-shrink:0;
  }
  #my-status-text{
    font-size:13px;
    color:var(--text-muted);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  #change-name-btn{
    margin-left:auto;
    background:none;
    border:none;
    color:var(--text-muted);
    cursor:pointer;
    font-size:16px;
    padding:6px;
    border-radius:6px;
  }
  #change-name-btn:hover{background:var(--bg-hover);color:var(--text-main);}

  /* ---------- Main chat column ---------- */
  #main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  #chat-header{
    height:48px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    padding:0 16px;
    box-shadow:0 1px 0 rgba(0,0,0,.2);
    gap:8px;
    z-index:2;
  }
  #chat-header .hashtag{color:var(--text-faint);font-size:22px;font-weight:600;}
  #chat-header .chan-name{font-weight:700;font-size:15px;}
  #chat-header .sep{width:1px;height:24px;background:var(--divider);margin:0 4px;}
  #settings-btn{
    margin-left:auto;
    background:none;border:none;color:var(--text-muted);
    cursor:pointer;font-size:18px;padding:6px;border-radius:6px;
  }
  #settings-btn:hover{background:var(--bg-hover);color:var(--text-main);}

  /* pinned bar */
  #pinned-bar{
    display:none;
    flex-direction:column;
    gap:4px;
    background:#2b2d31;
    padding:8px 16px;
    max-height:120px;
    overflow-y:auto;
    border-bottom:1px solid var(--divider);
    flex-shrink:0;
  }
  #pinned-bar.show{display:flex;}
  .pinned-item{
    font-size:13px;
    color:var(--text-muted);
    display:flex;
    gap:6px;
  }
  .pinned-item .pin-icon{color:#faa61a;}
  .pinned-item b{color:var(--text-main);}

  #chat-scroll{
    flex:1;
    overflow-y:auto;
    padding:16px 0 8px;
    position:relative;
  }
  #jump-bottom{
    position:absolute;
    bottom:12px;
    right:24px;
    background:var(--bg-input);
    color:var(--text-main);
    border:none;
    border-radius:20px;
    padding:8px 14px;
    font-size:13px;
    cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,.4);
    display:none;
  }
  #jump-bottom.show{display:block;}

  .msg-row{
    display:flex;
    gap:16px;
    padding:2px 16px 2px 16px;
    position:relative;
  }
  .msg-row:hover{background:rgba(0,0,0,.08);}
  .msg-row:hover .msg-actions{display:flex;}
  .avatar{
    width:40px;height:40px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:15px;color:#fff;
    flex-shrink:0;margin-top:2px;
    user-select:none;
  }
  .msg-body{flex:1;min-width:0;}
  .msg-meta{
    display:flex;align-items:baseline;gap:8px;
    margin-bottom:2px;
  }
  .msg-uname{font-weight:600;font-size:15px;color:var(--text-main);}
  .msg-time{font-size:12px;color:var(--text-faint);}
  .msg-edited{font-size:10px;color:var(--text-faint);}
  .msg-text{
    font-size:15px;
    line-height:1.4;
    color:#dbdee1;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .msg-text.system{color:var(--text-muted);font-style:italic;}
  .msg-actions{
    display:none;
    position:absolute;
    top:-14px;right:16px;
    background:var(--bg-chat);
    border:1px solid var(--divider);
    border-radius:8px;
    overflow:hidden;
  }
  .msg-actions button{
    background:none;border:none;color:var(--text-muted);
    padding:6px 8px;cursor:pointer;font-size:15px;
  }
  .msg-actions button:hover{background:var(--bg-hover);color:var(--text-main);}
  .msg-actions button.danger:hover{color:var(--danger);}
  .msg-actions button.pin-active{color:#faa61a;}

  .edit-box textarea{
    width:100%;
    background:var(--bg-input);
    color:var(--text-main);
    border:none;border-radius:6px;
    padding:8px 10px;font-size:15px;
    font-family:inherit;
    resize:none;
  }
  .edit-hint{font-size:12px;color:var(--text-faint);margin-top:4px;}
  .edit-hint span{color:var(--accent);cursor:pointer;}

  /* reactions */
  .reactions-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;}
  .reaction-pill{
    display:flex;align-items:center;gap:4px;
    background:var(--bg-input);
    border:1px solid transparent;
    border-radius:10px;
    padding:1px 7px;
    font-size:12px;
    cursor:pointer;
    color:var(--text-muted);
  }
  .reaction-pill:hover{border-color:var(--text-faint);}
  .reaction-pill.mine{background:rgba(88,101,242,.18);border-color:var(--accent);color:#c9cdfb;}
  .add-reaction-btn{
    background:var(--bg-input);
    border:none;border-radius:10px;
    padding:1px 7px;font-size:12px;
    color:var(--text-faint);cursor:pointer;
    display:none;
  }
  .msg-row:hover .add-reaction-btn{display:inline-block;}

  .react-picker{
    position:absolute;
    background:var(--bg-sidebar);
    border:1px solid var(--divider);
    border-radius:10px;
    padding:6px;
    display:flex;gap:4px;
    z-index:20;
    box-shadow:0 4px 12px rgba(0,0,0,.5);
  }
  .react-picker button{
    background:none;border:none;font-size:18px;cursor:pointer;
    padding:4px;border-radius:6px;
  }
  .react-picker button:hover{background:var(--bg-hover);}

  /* typing indicator */
  #typing-indicator{
    min-height:20px;
    padding:0 16px;
    font-size:13px;
    color:var(--text-muted);
    font-style:italic;
    flex-shrink:0;
  }

  /* composer */
  #composer{
    padding:0 16px 20px;
    flex-shrink:0;
    position:relative;
  }
  #composer-inner{
    background:var(--bg-input);
    border-radius:8px;
    display:flex;
    align-items:flex-end;
    padding:0 8px;
  }
  #emoji-btn{
    background:none;border:none;color:var(--text-muted);
    font-size:20px;cursor:pointer;padding:12px 8px;
  }
  #emoji-btn:hover{color:var(--text-main);}
  #message{
    flex:1;
    background:none;border:none;outline:none;
    color:var(--text-main);
    font-size:15px;
    font-family:inherit;
    padding:12px 4px;
    max-height:160px;
    resize:none;
    line-height:1.4;
  }
  #message::placeholder{color:var(--text-faint);}
  #send-btn{
    background:none;border:none;color:var(--accent);
    font-size:20px;cursor:pointer;padding:12px 8px;
  }
  #send-btn:hover{color:var(--accent-hover);}
  #cooldown-msg{
    font-size:12px;color:var(--danger);
    padding:4px 4px 0;
    display:none;
  }

  /* emoji picker panel */
  #emoji-panel{
    display:none;
    position:absolute;
    bottom:70px;
    left:16px;
    background:var(--bg-sidebar);
    border:1px solid var(--divider);
    border-radius:10px;
    padding:10px;
    grid-template-columns:repeat(8,1fr);
    gap:4px;
    box-shadow:0 6px 20px rgba(0,0,0,.5);
    z-index:20;
    width:280px;
  }
  #emoji-panel.show{display:grid;}
  #emoji-panel button{
    background:none;border:none;font-size:20px;
    cursor:pointer;padding:5px;border-radius:6px;
  }
  #emoji-panel button:hover{background:var(--bg-hover);}

  /* ---------- Username modal ---------- */
  #name-modal-overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.7);
    display:flex;align-items:center;justify-content:center;
    z-index:100;
  }
  #name-modal{
    background:var(--bg-sidebar);
    border-radius:8px;
    width:100%;max-width:420px;
    padding:28px;
    box-shadow:0 8px 32px rgba(0,0,0,.6);
  }
  #name-modal h2{font-size:22px;margin-bottom:8px;}
  #name-modal p{font-size:14px;color:var(--text-muted);margin-bottom:20px;}
  #name-modal label{
    font-size:12px;font-weight:700;text-transform:uppercase;
    color:var(--text-muted);display:block;margin-bottom:6px;
  }
  #name-input{
    width:100%;
    background:var(--bg-deepest);
    border:1px solid var(--divider);
    color:var(--text-main);
    padding:10px 12px;
    border-radius:4px;
    font-size:15px;
    outline:none;
  }
  #name-input:focus{border-color:var(--accent);}
  #name-error{
    color:var(--danger);
    font-size:13px;
    margin-top:8px;
    min-height:16px;
  }
  #name-submit{
    margin-top:20px;
    width:100%;
    background:var(--accent);
    border:none;color:#fff;
    padding:12px;border-radius:6px;
    font-size:15px;font-weight:600;
    cursor:pointer;
  }
  #name-submit:hover{background:var(--accent-hover);}
  #name-submit:disabled{opacity:.5;cursor:default;}

  /* scrollbars */
  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#232428;border-radius:4px;}

  /* mobile responsive */
  @media (max-width:720px){
    #sidebar{
      position:fixed;
      top:0;bottom:0;right:0;
      width:220px;
      transform:translateX(100%);
      transition:transform .2s ease;
      z-index:50;
      box-shadow:-4px 0 12px rgba(0,0,0,.4);
    }
    #sidebar.open{transform:translateX(0);}
    #toggle-sidebar{
      display:inline-flex;
      background:none;border:none;color:var(--text-muted);
      font-size:18px;cursor:pointer;padding:6px;border-radius:6px;
      margin-left:auto;
    }
    .avatar{width:32px;height:32px;font-size:13px;}
    #emoji-panel{width:240px;grid-template-columns:repeat(6,1fr);left:8px;}
  }
  @media (min-width:721px){
    #toggle-sidebar{display:none;}
  }
</style>
</head>
<body>

<div id="app">

  <div id="main">
    <div id="chat-header">
      <span class="hashtag">#</span>
      <span class="chan-name">general</span>
      <div class="sep"></div>
      <span id="user-count-label" style="font-size:13px;color:var(--text-muted);"></span>
      <button id="toggle-sidebar">👥</button>
      <button id="settings-btn" title="Toggle swear filter">⚙️</button>
    </div>

    <div id="pinned-bar"></div>

    <div id="chat-scroll">
      <div id="chat"></div>
      <button id="jump-bottom">↓ Jump to latest</button>
    </div>

    <div id="typing-indicator"></div>

    <div id="composer">
      <div id="cooldown-msg">Slow down — please wait a moment before sending another message.</div>
      <div id="composer-inner">
        <button id="emoji-btn">😊</button>
        <textarea id="message" placeholder="Message #general" rows="1"></textarea>
        <button id="send-btn">➤</button>
      </div>
      <div id="emoji-panel"></div>
    </div>
  </div>

  <div id="sidebar">
    <div id="sidebar-header">Online</div>
    <div id="online-list"></div>
    <div id="sidebar-footer">
      <div class="avatar" id="my-avatar" style="width:32px;height:32px;font-size:13px;"></div>
      <div id="my-status-text"></div>
      <button id="change-name-btn" title="Change username">✏️</button>
    </div>
  </div>

</div>

<!-- Username modal -->
<div id="name-modal-overlay">
  <div id="name-modal">
    <h2>Choose a username</h2>
    <p>Pick something unique — it'll be reserved while you're online.</p>
    <label for="name-input">Username</label>
    <input id="name-input" maxlength="20" placeholder="e.g. Alex" autocomplete="off">
    <div id="name-error"></div>
    <button id="name-submit">Continue</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import {
  getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, setDoc, getDoc,
  query, orderBy, limit, onSnapshot, serverTimestamp, runTransaction,
  arrayUnion, arrayRemove, Timestamp
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

/* ---------------- Firebase setup (your existing config) ---------------- */
const firebaseConfig = {
  apiKey: "AIzaSyDGu1knIbZAzpln67J2riVY_JyYXLuI3W8",
  authDomain: "website-chat-a3a6f.firebaseapp.com",
  projectId: "website-chat-a3a6f",
  storageBucket: "website-chat-a3a6f.firebasestorage.app",
  messagingSenderId: "682151853413",
  appId: "1:682151853413:web:a783dd52a601c8904bb58c"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const messagesCol = collection(db, "messages");
const usernamesCol = collection(db, "usernames");
const typingCol = collection(db, "typing");

/* ---------------- Constants ---------------- */
const MAX_MESSAGES = 100;
const PRESENCE_TIMEOUT_MS = 30000;   // considered offline if no heartbeat in this window
const HEARTBEAT_INTERVAL_MS = 15000;
const TYPING_TIMEOUT_MS = 5000;
const SEND_COOLDOWN_MS = 1500;
const SWEAR_WORDS = ["damn","hell","crap","shit","fuck","ass","bitch","bastard"]; // basic list
const REACTION_EMOJIS = ["👍","❤️","😂","😮","😢","😡"];
const EMOJI_PICKER_SET = "😀 😁 😂 🤣 😊 😍 😘 😜 🤔 😎 😴 🥳 😭 😡 🤯 🥺 👍 👎 👏 🙌 🙏 🔥 💯 ❤️ 💔 ✨ 🎉 🎊 😱 😇 🤗 🤝 👀 💀 🤡 😅 😆 🙂 🙃 😉".split(" ");
const AVATAR_COLORS = ["#5865f2","#eb459e","#faa61a","#3ba55c","#ed4245","#00a8fc","#9b59b6","#f47b67"];

/* ---------------- Local state ---------------- */
let myUid = null;
let myUsername = localStorage.getItem("chatName") || "";
let lastSentAt = 0;
let userScrolledUp = false;
let typingTimeout = null;
let heartbeatInterval = null;
let onlineUsers = new Map();   // username -> {lastActive, uid}
let currentMessages = [];      // cached latest render data
let swearFilterOn = localStorage.getItem("swearFilterOn") !== "off";

/* ---------------- DOM refs ---------------- */
const chatEl = document.getElementById("chat");
const chatScroll = document.getElementById("chat-scroll");
const jumpBtn = document.getElementById("jump-bottom");
const messageInput = document.getElementById("message");
const sendBtn = document.getElementById("send-btn");
const cooldownMsg = document.getElementById("cooldown-msg");
const typingIndicator = document.getElementById("typing-indicator");
const onlineListEl = document.getElementById("online-list");
const userCountLabel = document.getElementById("user-count-label");
const pinnedBar = document.getElementById("pinned-bar");
const emojiBtn = document.getElementById("emoji-btn");
const emojiPanel = document.getElementById("emoji-panel");
const myAvatarEl = document.getElementById("my-avatar");
const myStatusText = document.getElementById("my-status-text");
const changeNameBtn = document.getElementById("change-name-btn");
const settingsBtn = document.getElementById("settings-btn");
const toggleSidebarBtn = document.getElementById("toggle-sidebar");
const sidebar = document.getElementById("sidebar");

const nameOverlay = document.getElementById("name-modal-overlay");
const nameInput = document.getElementById("name-input");
const nameError = document.getElementById("name-error");
const nameSubmit = document.getElementById("name-submit");

/* ---------------- Helpers ---------------- */
function normalize(name){ return name.trim().toLowerCase(); }

function colorForName(name){
  let hash = 0;
  for(let i=0;i<name.length;i++) hash = name.charCodeAt(i) + ((hash<<5)-hash);
  return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
}

function initialsForName(name){
  const parts = name.trim().split(/\s+/);
  if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0] + parts[1][0]).toUpperCase();
}

function timeAgo(date){
  if(!date) return "";
  const seconds = Math.floor((Date.now() - date.getTime())/1000);
  if(seconds < 10) return "just now";
  if(seconds < 60) return seconds + "s ago";
  const mins = Math.floor(seconds/60);
  if(mins < 60) return mins + (mins===1 ? " minute ago" : " minutes ago");
  const hours = Math.floor(mins/60);
  if(hours < 24) return hours + (hours===1 ? " hour ago" : " hours ago");
  const days = Math.floor(hours/24);
  if(days < 7) return days + (days===1 ? " day ago" : " days ago");
  return date.toLocaleDateString();
}

function filterSwears(text){
  if(!swearFilterOn) return text;
  let out = text;
  SWEAR_WORDS.forEach(w=>{
    const re = new RegExp("\\b"+w+"\\b","gi");
    out = out.replace(re, m => m[0] + "*".repeat(Math.max(m.length-1,1)));
  });
  return out;
}

function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

function isNearBottom(){
  return chatScroll.scrollHeight - chatScroll.scrollTop - chatScroll.clientHeight < 80;
}

function scrollToBottom(){
  chatScroll.scrollTop = chatScroll.scrollHeight;
  jumpBtn.classList.remove("show");
  userScrolledUp = false;
}

/* ---------------- Username modal / reservation ---------------- */
function showNameModal(prefill){
  nameOverlay.style.display = "flex";
  nameInput.value = prefill || "";
  nameError.textContent = "";
  setTimeout(()=>nameInput.focus(), 50);
}
function hideNameModal(){
  nameOverlay.style.display = "none";
}

async function tryReserveUsername(name){
  const key = normalize(name);
  if(!key) return {ok:false, error:"Please enter a username."};
  if(key.length < 2) return {ok:false, error:"Username must be at least 2 characters."};
  if(key.length > 20) return {ok:false, error:"Username must be 20 characters or fewer."};
  if(!/^[a-z0-9_ .-]+$/.test(key)) return {ok:false, error:"Only letters, numbers, spaces, - and _ are allowed."};

  const ref = doc(usernamesCol, key);
  try{
    const result = await runTransaction(db, async (tx)=>{
      const snap = await tx.get(ref);
      if(snap.exists()){
        const data = snap.data();
        const last = data.lastActive ? data.lastActive.toMillis() : 0;
        const stillOnline = (Date.now() - last) < PRESENCE_TIMEOUT_MS;
        if(stillOnline && data.uid !== myUid){
          throw new Error("TAKEN");
        }
      }
      tx.set(ref, {
        username: name.trim(),
        uid: myUid,
        lastActive: serverTimestamp()
      });
      return true;
    });
    return {ok:true};
  }catch(e){
    if(e.message === "TAKEN") return {ok:false, error:"That username is currently taken. Try another."};
    console.error(e);
    return {ok:false, error:"Something went wrong reserving that username. Try again."};
  }
}

async function releaseUsername(name){
  if(!name) return;
  try{
    const ref = doc(usernamesCol, normalize(name));
    const snap = await getDoc(ref);
    if(snap.exists() && snap.data().uid === myUid){
      await deleteDoc(ref);
    }
  }catch(e){ /* best effort */ }
}

nameSubmit.addEventListener("click", submitName);
nameInput.addEventListener("keydown", (e)=>{ if(e.key==="Enter"){ e.preventDefault(); submitName(); }});

async function submitName(){
  nameSubmit.disabled = true;
  nameError.textContent = "";
  const value = nameInput.value;
  const res = await tryReserveUsername(value);
  if(res.ok){
    const oldName = myUsername;
    myUsername = value.trim();
    localStorage.setItem("chatName", myUsername);
    if(oldName && oldName !== myUsername) releaseUsername(oldName);
    hideNameModal();
    initPresenceForMe();
    renderMyIdentity();
  }else{
    nameError.textContent = res.error;
  }
  nameSubmit.disabled = false;
}

changeNameBtn.addEventListener("click", ()=> showNameModal(myUsername));

/* ---------------- Presence / online list ---------------- */
function initPresenceForMe(){
  if(heartbeatInterval) clearInterval(heartbeatInterval);
  heartbeat();
  heartbeatInterval = setInterval(heartbeat, HEARTBEAT_INTERVAL_MS);
}

async function heartbeat(){
  if(!myUsername || !myUid) return;
  try{
    await setDoc(doc(usernamesCol, normalize(myUsername)), {
      username: myUsername,
      uid: myUid,
      lastActive: serverTimestamp()
    });
  }catch(e){ console.error("heartbeat failed", e); }
}

function renderMyIdentity(){
  myAvatarEl.style.background = colorForName(myUsername);
  myAvatarEl.textContent = initialsForName(myUsername);
  myStatusText.textContent = myUsername;
}

function renderOnlineList(){
  const now = Date.now();
  const online = [...onlineUsers.entries()]
    .filter(([name, data]) => (now - data.lastActive) < PRESENCE_TIMEOUT_MS)
    .sort((a,b)=> a[0].localeCompare(b[0]));

  userCountLabel.textContent = online.length + (online.length===1 ? " user online" : " users online");
  onlineListEl.innerHTML = `<div class="section-label">Online — ${online.length}</div>`;

  online.forEach(([name, data])=>{
    const row = document.createElement("div");
    row.className = "user-row" + (data.uid === myUid ? " me" : "");
    row.innerHTML = `
      <div class="avatar" style="width:28px;height:28px;font-size:11px;background:${colorForName(name)}">${initialsForName(name)}</div>
      <span class="uname">${escapeHtml(name)}${data.uid===myUid ? " (you)" : ""}</span>
      <span class="dot" style="margin-left:auto;"></span>
    `;
    onlineListEl.appendChild(row);
  });
}

onSnapshot(usernamesCol, (snap)=>{
  onlineUsers.clear();
  snap.forEach(d=>{
    const data = d.data();
    onlineUsers.set(data.username, {
      lastActive: data.lastActive ? data.lastActive.toMillis() : 0,
      uid: data.uid
    });
  });
  renderOnlineList();
});

// re-check staleness periodically even without new snapshots
setInterval(renderOnlineList, 10000);

/* ---------------- Typing indicator ---------------- */
let typingUsers = new Map(); // username -> lastUpdateMillis

onSnapshot(typingCol, (snap)=>{
  typingUsers.clear();
  snap.forEach(d=>{
    const data = d.data();
    if(d.id === myUid) return;
    const updated = data.updated ? data.updated.toMillis() : 0;
    if(Date.now() - updated < TYPING_TIMEOUT_MS){
      typingUsers.set(data.username, updated);
    }
  });
  renderTypingIndicator();
});

setInterval(renderTypingIndicator, 2000);

function renderTypingIndicator(){
  const now = Date.now();
  const names = [...typingUsers.entries()]
    .filter(([,t]) => now - t < TYPING_TIMEOUT_MS)
    .map(([name]) => name);

  if(names.length === 0){ typingIndicator.textContent = ""; return; }
  if(names.length === 1){ typingIndicator.textContent = `${names[0]} is typing...`; return; }
  if(names.length === 2){ typingIndicator.textContent = `${names[0]} and ${names[1]} are typing...`; return; }
  typingIndicator.textContent = `Several people are typing...`;
}

let lastTypingWrite = 0;
async function signalTyping(){
  if(!myUid || !myUsername) return;
  const now = Date.now();
  if(now - lastTypingWrite < 2000) return; // throttle writes
  lastTypingWrite = now;
  try{
    await setDoc(doc(typingCol, myUid), { username: myUsername, updated: serverTimestamp() });
  }catch(e){ /* ignore */ }
}

async function clearTyping(){
  if(!myUid) return;
  try{ await deleteDoc(doc(typingCol, myUid)); }catch(e){ /* ignore */ }
}

/* ---------------- Composer ---------------- */
messageInput.addEventListener("input", ()=>{
  autoGrow();
  if(messageInput.value.trim().length > 0){
    signalTyping();
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(clearTyping, TYPING_TIMEOUT_MS);
  }
});

function autoGrow(){
  messageInput.style.height = "auto";
  messageInput.style.height = Math.min(messageInput.scrollHeight, 160) + "px";
}

messageInput.addEventListener("keydown", (e)=>{
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});
sendBtn.addEventListener("click", sendMessage);

async function sendMessage(){
  const text = messageInput.value.trim();
  if(!text) return;
  const now = Date.now();
  if(now - lastSentAt < SEND_COOLDOWN_MS){
    cooldownMsg.style.display = "block";
    setTimeout(()=> cooldownMsg.style.display = "none", 1200);
    return;
  }
  lastSentAt = now;

  messageInput.value = "";
  autoGrow();
  clearTimeout(typingTimeout);
  clearTyping();

  try{
    await addDoc(messagesCol, {
      uid: myUid,
      username: myUsername,
      text: filterSwears(text),
      created: serverTimestamp(),
      edited: false,
      pinned: false,
      type: "message",
      reactions: {}
    });
  }catch(e){
    console.error("send failed", e);
  }
}

/* ---------------- Emoji picker ---------------- */
function buildEmojiPanel(){
  emojiPanel.innerHTML = "";
  EMOJI_PICKER_SET.forEach(em=>{
    const b = document.createElement("button");
    b.textContent = em;
    b.addEventListener("click", ()=>{
      messageInput.value += em;
      messageInput.focus();
      autoGrow();
    });
    emojiPanel.appendChild(b);
  });
}
buildEmojiPanel();

emojiBtn.addEventListener("click", (e)=>{
  e.stopPropagation();
  emojiPanel.classList.toggle("show");
});
document.addEventListener("click", (e)=>{
  if(!emojiPanel.contains(e.target) && e.target !== emojiBtn){
    emojiPanel.classList.remove("show");
  }
});

/* ---------------- Settings (swear filter toggle) ---------------- */
settingsBtn.addEventListener("click", ()=>{
  swearFilterOn = !swearFilterOn;
  localStorage.setItem("swearFilterOn", swearFilterOn ? "on" : "off");
  settingsBtn.title = swearFilterOn ? "Swear filter: ON (click to disable)" : "Swear filter: OFF (click to enable)";
  settingsBtn.style.color = swearFilterOn ? "" : "var(--danger)";
});
settingsBtn.title = swearFilterOn ? "Swear filter: ON (click to disable)" : "Swear filter: OFF (click to enable)";

/* ---------------- Mobile sidebar toggle ---------------- */
toggleSidebarBtn.addEventListener("click", ()=> sidebar.classList.toggle("open"));

/* ---------------- Scroll handling ---------------- */
chatScroll.addEventListener("scroll", ()=>{
  if(isNearBottom()){
    userScrolledUp = false;
    jumpBtn.classList.remove("show");
  }else{
    userScrolledUp = true;
    jumpBtn.classList.add("show");
  }
});
jumpBtn.addEventListener("click", scrollToBottom);

/* ---------------- Reaction picker (floating) ---------------- */
let openReactPicker = null;
function closeReactPicker(){
  if(openReactPicker){ openReactPicker.remove(); openReactPicker = null; }
}
document.addEventListener("click", (e)=>{
  if(openReactPicker && !openReactPicker.contains(e.target) && !e.target.classList.contains("add-reaction-btn")){
    closeReactPicker();
  }
});

async function toggleReaction(msgId, emoji, reactions){
  const ref = doc(messagesCol, msgId);
  const list = (reactions && reactions[emoji]) || [];
  const mine = list.includes(myUid);
  const fieldPath = `reactions.${emoji}`;
  try{
    await updateDoc(ref, { [fieldPath]: mine ? arrayRemove(myUid) : arrayUnion(myUid) });
  }catch(e){ console.error(e); }
}

/* ---------------- Message rendering ---------------- */
function renderReactions(msgId, reactions){
  const wrap = document.createElement("div");
  wrap.className = "reactions-row";
  const reactionData = reactions || {};

  REACTION_EMOJIS.forEach(em=>{
    const list = reactionData[em] || [];
    if(list.length === 0) return;
    const pill = document.createElement("div");
    pill.className = "reaction-pill" + (list.includes(myUid) ? " mine" : "");
    pill.innerHTML = `<span>${em}</span><span>${list.length}</span>`;
    pill.addEventListener("click", ()=> toggleReaction(msgId, em, reactionData));
    wrap.appendChild(pill);
  });

  const addBtn = document.createElement("button");
  addBtn.className = "add-reaction-btn";
  addBtn.textContent = "😊+";
  addBtn.addEventListener("click", (e)=>{
    e.stopPropagation();
    closeReactPicker();
    const picker = document.createElement("div");
    picker.className = "react-picker";
    REACTION_EMOJIS.forEach(em=>{
      const b = document.createElement("button");
      b.textContent = em;
      b.addEventListener("click", ()=>{
        toggleReaction(msgId, em, reactionData);
        closeReactPicker();
      });
      picker.appendChild(b);
    });
    document.body.appendChild(picker);
    const rect = addBtn.getBoundingClientRect();
    picker.style.top = (rect.top - 46) + "px";
    picker.style.left = Math.max(8, rect.left - 100) + "px";
    openReactPicker = picker;
  });
  wrap.appendChild(addBtn);

  return wrap;
}

function renderMessage(data, id){
  const row = document.createElement("div");
  row.className = "msg-row";
  row.dataset.id = id;

  const isMine = data.uid === myUid;
  const createdDate = data.created ? data.created.toDate() : new Date();

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.style.background = colorForName(data.username || "?");
  avatar.textContent = initialsForName(data.username || "?");
  row.appendChild(avatar);

  const body = document.createElement("div");
  body.className = "msg-body";

  const meta = document.createElement("div");
  meta.className = "msg-meta";
  meta.innerHTML = `
    <span class="msg-uname">${escapeHtml(data.username || "Unknown")}</span>
    <span class="msg-time" data-ts="${createdDate.getTime()}">${timeAgo(createdDate)}</span>
    ${data.edited ? '<span class="msg-edited">(edited)</span>' : ''}
  `;
  body.appendChild(meta);

  const textEl = document.createElement("div");
  textEl.className = "msg-text" + (data.type === "system" ? " system" : "");
  textEl.textContent = data.text || "";
  body.appendChild(textEl);

  body.appendChild(renderReactions(id, data.reactions));
  row.appendChild(body);

  // action buttons (edit/delete/pin) — only show delete/edit for own messages
  const actions = document.createElement("div");
  actions.className = "msg-actions";

  const pinBtn = document.createElement("button");
  pinBtn.textContent = "📌";
  pinBtn.title = data.pinned ? "Unpin message" : "Pin message";
  if(data.pinned) pinBtn.classList.add("pin-active");
  pinBtn.addEventListener("click", async ()=>{
    try{ await updateDoc(doc(messagesCol, id), { pinned: !data.pinned }); }catch(e){ console.error(e); }
  });
  actions.appendChild(pinBtn);

  if(isMine && data.type !== "system"){
    const editBtn = document.createElement("button");
    editBtn.textContent = "✏️";
    editBtn.title = "Edit";
    editBtn.addEventListener("click", ()=> startEdit(row, id, data));
    actions.appendChild(editBtn);

    const delBtn = document.createElement("button");
    delBtn.textContent = "🗑️";
    delBtn.title = "Delete";
    delBtn.className = "danger";
    delBtn.addEventListener("click", async ()=>{
      if(confirm("Delete this message?")){
        try{ await deleteDoc(doc(messagesCol, id)); }catch(e){ console.error(e); }
      }
    });
    actions.appendChild(delBtn);
  }
  row.appendChild(actions);

  return row;
}

function startEdit(row, id, data){
  const body = row.querySelector(".msg-body");
  const textEl = body.querySelector(".msg-text");
  const reactionsEl = body.querySelector(".reactions-row");

  const editBox = document.createElement("div");
  editBox.className = "edit-box";
  const textarea = document.createElement("textarea");
  textarea.value = data.text;
  textarea.rows = 2;
  editBox.appendChild(textarea);

  const hint = document.createElement("div");
  hint.className = "edit-hint";
  hint.innerHTML = `escape to <span class="cancel">cancel</span> • enter to <span class="save">save</span>`;
  editBox.appendChild(hint);

  textEl.style.display = "none";
  if(reactionsEl) reactionsEl.style.display = "none";
  textEl.insertAdjacentElement("afterend", editBox);
  textarea.focus();
  textarea.setSelectionRange(textarea.value.length, textarea.value.length);

  function cleanup(){
    editBox.remove();
    textEl.style.display = "";
    if(reactionsEl) reactionsEl.style.display = "";
  }

  async function save(){
    const newText = filterSwears(textarea.value.trim());
    if(newText && newText !== data.text){
      try{
        await updateDoc(doc(messagesCol, id), { text: newText, edited: true, editedAt: serverTimestamp() });
      }catch(e){ console.error(e); }
    }
    cleanup();
  }

  textarea.addEventListener("keydown", (e)=>{
    if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); save(); }
    if(e.key === "Escape"){ cleanup(); }
  });
  hint.querySelector(".save").addEventListener("click", save);
  hint.querySelector(".cancel").addEventListener("click", cleanup);
}

function renderPinnedBar(pinnedMsgs){
  if(pinnedMsgs.length === 0){
    pinnedBar.classList.remove("show");
    pinnedBar.innerHTML = "";
    return;
  }
  pinnedBar.classList.add("show");
  pinnedBar.innerHTML = "";
  pinnedMsgs.forEach(m=>{
    const item = document.createElement("div");
    item.className = "pinned-item";
    item.innerHTML = `<span class="pin-icon">📌</span><span><b>${escapeHtml(m.username||"")}</b>: ${escapeHtml(m.text||"")}</span>`;
    pinnedBar.appendChild(item);
  });
}

/* update relative timestamps periodically without a full re-render */
setInterval(()=>{
  document.querySelectorAll(".msg-time[data-ts]").forEach(el=>{
    const ts = parseInt(el.dataset.ts, 10);
    el.textContent = timeAgo(new Date(ts));
  });
}, 30000);

/* ---------------- Messages subscription ---------------- */
const q = query(messagesCol, orderBy("created", "desc"), limit(MAX_MESSAGES));

onSnapshot(q, (snapshot)=>{
  const docs = [];
  snapshot.forEach(d => docs.push({ id: d.id, data: d.data() }));
  docs.reverse(); // oldest first for display

  const wasNearBottom = isNearBottom();

  chatEl.innerHTML = "";
  const pinned = [];
  docs.forEach(({id, data})=>{
    if(data.pinned) pinned.push(data);
    chatEl.appendChild(renderMessage(data, id));
  });
  renderPinnedBar(pinned);

  if(!userScrolledUp || wasNearBottom){
    scrollToBottom();
  }else{
    jumpBtn.classList.add("show");
  }
});

/* ---------------- Cleanup on unload (best effort) ---------------- */
window.addEventListener("beforeunload", ()=>{
  releaseUsername(myUsername);
  clearTyping();
});

/* ---------------- Boot ---------------- */
async function boot(){
  await signInAnonymously(auth);
  myUid = auth.currentUser.uid;

  if(myUsername){
    const res = await tryReserveUsername(myUsername);
    if(res.ok){
      renderMyIdentity();
      initPresenceForMe();
    }else{
      showNameModal(myUsername);
    }
  }else{
    showNameModal("");
  }
}
boot();
</script>
